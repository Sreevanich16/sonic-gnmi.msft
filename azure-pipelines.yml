# sonic-gnmi Azure Pipelines definition
#
# Stage layout:
#   StaticChecks  - fast language-level checks (gofmt).
#   Test          - unit, memory-leak, and integration tests + coverage gate.
#   Package       - produce amd64 and arm64 .deb artifacts.
#
# Notes on naming (do not "fix"):
#   * The job `build` inside stage `Test` is deliberately kept with both
#     `job: build` and `displayName: "build"`. The pipeline decorator that
#     publishes the diff-coverage GitHub check derives its name as
#     `coverage.{BuildDefinitionName}.{Agent.JobName}`. `Agent.JobName`
#     resolves to the job displayName, so changing either value would
#     rename the required `coverage.sonic-net.sonic-gnmi.build` check.

trigger:
  branches:
    include:
    - master
    - 202???
    - 201???

pr:
  branches:
    include:
    - master
    - 202???
    - 201???

variables:
  - name: BUILD_BRANCH
    value: 'master'
  - name: UNIT_TEST_FLAG
    value: 'ENABLE_TRANSLIB_WRITE=y'
  - name: DIFF_COVER_WORKING_DIRECTORY
    value: $(System.DefaultWorkingDirectory)/sonic-gnmi.msft

resources:
  repositories:
  - repository: sonic-mgmt-common
    type: github
    name: sonic-net/sonic-mgmt-common
    endpoint: sonic-net
    ref: refs/heads/$(BUILD_BRANCH)
  - repository: sonic-swss-common
    type: github
    name: sonic-net/sonic-swss-common
    endpoint: sonic-net
    ref: refs/heads/$(BUILD_BRANCH)

stages:
- stage: StaticChecks
  displayName: "Static Checks"
  jobs:
  - job: go_static_checks
    displayName: "Go static checks"
    timeoutInMinutes: 10

    pool:
      vmImage: ubuntu-22.04

    variables:
      GO_VERSION: '1.24.4'

    steps:
    - checkout: self
      clean: true
      displayName: 'Checkout code'

    - checkout: sonic-mgmt-common
      clean: true
      displayName: 'Checkout sonic-mgmt-common'

    - template: .azure/templates/install-go.yml
      parameters:
        version: $(GO_VERSION)

    - bash: |
        set -euo pipefail
        export PATH=$PATH:/usr/local/go/bin:$(go env GOPATH)/bin
        cd sonic-gnmi.msft
        go mod tidy
        make -f pure.mk junit-xml
      displayName: 'Run pure package tests'

    - task: PublishTestResults@2
      displayName: 'Publish pure package test results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(System.DefaultWorkingDirectory)/sonic-gnmi.msft/test-results/junit-pure.xml'
        failTaskOnFailedTests: true
        publishRunAttachments: true
        testRunTitle: 'Pure package tests'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Pure Package Coverage'
      condition: always()
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/sonic-gnmi.msft/test-results/coverage-pure.xml'

    - publish: $(System.DefaultWorkingDirectory)/sonic-gnmi.msft/test-results/coverage-pure.xml
      artifact: coverage-pure
      displayName: 'Publish pure coverage artifact'
      condition: always()

    - publish: $(System.DefaultWorkingDirectory)/sonic-gnmi/test-results/coverage-pure.xml
      artifact: coverage-pure
      displayName: 'Publish pure coverage artifact'
      condition: always()

  # Memory leak testing with address sanitizer
  - job: memleak_tests
    displayName: "Memory-leak tests"
    timeoutInMinutes: 45

    pool:
      name: sonicso1ES-amd64
      vmImage: ubuntu-22.04

    variables:
      DIFF_COVER_CHECK_THRESHOLD: 80
      DIFF_COVER_ENABLE: 'true'
      DIFF_COVER_WORKING_DIRECTORY: $(System.DefaultWorkingDirectory)/sonic-gnmi.msft
      UNIT_TEST_FLAG: 'ENABLE_TRANSLIB_WRITE=y'

    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:latest

    steps:
    - template: .azure/templates/setup-test-env.yml
      parameters:
        buildBranch: $(BUILD_BRANCH)
        arch: amd64
        installTestDeps: true

    # Memory leak tests with JUnit XML generation

    - bash: |
        set -euo pipefail
        pushd sonic-gnmi.msft
        make all && $(UNIT_TEST_FLAG) make check_memleak_junit
        popd
      displayName: 'Run Memory Leak Tests'

    - task: PublishTestResults@2
      displayName: 'Publish memory-leak test results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(System.DefaultWorkingDirectory)/sonic-gnmi.msft/test-results/junit-memleak-standard.xml'
        failTaskOnFailedTests: true
        publishRunAttachments: true
        testRunTitle: 'Memory-leak tests'

  # Full integration testing with SONiC dependencies
  - job: integration_tests
    displayName: "Integration tests"
    timeoutInMinutes: 60

    pool:
      name: sonicso1ES-amd64
      vmImage: ubuntu-22.04

    variables:
      DIFF_COVER_CHECK_THRESHOLD: 80
      DIFF_COVER_ENABLE: 'true'
      DIFF_COVER_WORKING_DIRECTORY: $(System.DefaultWorkingDirectory)/sonic-gnmi.msft

    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:latest

    steps:
    - checkout: self
      clean: true
      submodules: recursive
      fetchDepth: 0
      displayName: 'Checkout code'

    - checkout: sonic-mgmt-common
      clean: true
      submodules: recursive
      displayName: 'Checkout sonic-mgmt-common'

    - checkout: sonic-swss-common
      clean: true
      submodules: recursive
      displayName: 'Checkout sonic-swss-common'

    # Install SONiC dependencies using shared template
    - template: .azure/templates/install-dependencies.yml
      parameters:
        buildBranch: $(BUILD_BRANCH)
        arch: amd64
        installTestDeps: true

    # Build sonic-mgmt-common (generates Go code that sonic-gnmi imports)
    - script: |
        set -ex
        pushd sonic-mgmt-common
        NO_TEST_BINS=1 dpkg-buildpackage -rfakeroot -b -us -uc
        popd

        pushd sonic-gnmi.msft
        ENABLE_TRANSLIB_WRITE=y ENABLE_NATIVE_WRITE=y dpkg-buildpackage -rfakeroot -us -uc -b -j$(nproc) && cp ../*.deb $(Build.ArtifactStagingDirectory)/
      displayName: "Build"

    # Run pure package tests for coverage (test results already published by PureCIJob)
    - bash: |
        set -euo pipefail
        pushd sonic-gnmi.msft
        make -f pure.mk junit-xml || true
        popd
      displayName: "Run Pure Package Tests (coverage only)"

    # Run integration tests
    - bash: |
        set -euo pipefail
        pushd sonic-gnmi.msft
        make all && $(UNIT_TEST_FLAG) make check_gotest_junit
        popd
      displayName: "Run Integration Tests"

    - task: PublishTestResults@2
      displayName: 'Publish integration test results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: |
          $(System.DefaultWorkingDirectory)/sonic-gnmi.msft/test-results/junit-integration-basic.xml
          $(System.DefaultWorkingDirectory)/sonic-gnmi.msft/test-results/junit-integration-env.xml
          $(System.DefaultWorkingDirectory)/sonic-gnmi.msft/test-results/junit-integration-dialout.xml
        failTaskOnFailedTests: true
        publishRunAttachments: true
        testRunTitle: 'Integration tests'

    - publish: $(Build.ArtifactStagingDirectory)/
      artifact: sonic-gnmi.msft
      displayName: "Archive artifacts"

    - bash: |
        sudo pip3 install --quiet --break-system-packages --ignore-installed diff-cover
      displayName: 'Pre-install diff-cover for pipeline decorator'
      workingDirectory: $(System.DefaultWorkingDirectory)/sonic-gnmi.msft

    - task: PublishCodeCoverageResults@2
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/sonic-gnmi.msft/coverage.xml'
      displayName: 'Publish coverage'

    - publish: $(System.DefaultWorkingDirectory)/sonic-gnmi.msft/coverage.xml
      artifact: coverage-integration
      displayName: 'Publish integration coverage artifact'
      condition: always()


- stage: BuildAmd64
  dependsOn: []
  jobs:
  - job: amd64
    displayName: "amd64 deb build"
    timeoutInMinutes: 60

    pool:
      name: sonicso1ES-amd64
      vmImage: ubuntu-22.04

    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:latest

    steps:
    - template: .azure/templates/build-deb.yml
      parameters:
        buildBranch: $(BUILD_BRANCH)
        arch: amd64
        publishArtifact: sonic-gnmi.msft.amd64

- stage: BuildArm64
  dependsOn: []
  jobs:
  - job: arm64
    displayName: "arm64 deb build"
    timeoutInMinutes: 60

    pool:
      name: sonicso1ES-arm64

    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:$(BUILD_BRANCH)-arm64

    steps:
    - template: .azure/templates/build-deb.yml
      parameters:
        buildBranch: $(BUILD_BRANCH)
        arch: arm64
        commonLibArtifact: common-lib.arm64
        swssCommonArtifact: sonic-swss-common-trixie.arm64
        publishArtifact: sonic-gnmi.msft.arm64
